<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Cara Log Masuk DELIMa 3.0 — Lucky Login</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050b2e;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-fps="30" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-composition-id="bg" data-composition-src="compositions/bg.html"
        data-start="0" data-duration="40" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>
      <div id="t1-title" class="clip" data-composition-id="t1-title" data-composition-src="compositions/t1-title.html"
        data-start="0" data-duration="4.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="t2-prep" class="clip" data-composition-id="t2-prep" data-composition-src="compositions/t2-prep.html"
        data-start="4.4" data-duration="5.9" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="t3-steps" class="clip" data-composition-id="t3-steps" data-composition-src="compositions/t3-steps.html"
        data-start="9.9" data-duration="22.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="t4-end" class="clip" data-composition-id="t4-end" data-composition-src="compositions/t4-end.html"
        data-start="32.5" data-duration="7.5" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <!-- Muzik + SFX (bina semula: python3 tools/mix_audio.py) -->
      <audio id="mix" class="clip" src="assets/audio/mix.wav" data-start="0" data-duration="40" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
