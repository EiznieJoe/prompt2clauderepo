<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #bg-base {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(900px 700px at 50% 30%, #1b4fd8 0%, rgba(27, 79, 216, 0) 70%),
        radial-gradient(700px 600px at 0% 100%, #0a3aa8 0%, rgba(10, 58, 168, 0) 70%),
        linear-gradient(180deg, #040a2a 0%, #071a66 55%, #040a2a 100%);
    }
    #bg-grid {
      position: absolute;
      left: -200px;
      top: -200px;
      width: 1480px;
      height: 2320px;
      background:
        repeating-linear-gradient(90deg, rgba(80, 200, 255, 0.12) 0 2px, rgba(0, 0, 0, 0) 2px 120px),
        repeating-linear-gradient(0deg, rgba(80, 200, 255, 0.12) 0 2px, rgba(0, 0, 0, 0) 2px 120px);
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, #000 0%, rgba(0, 0, 0, 0) 80%);
      mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, #000 0%, rgba(0, 0, 0, 0) 80%);
    }
    .bg-dot {
      position: absolute;
      border-radius: 50%;
      background: #cfe9ff;
      box-shadow: 0 0 6px #7fd0ff;
    }
  </style>
  <div id="root" data-composition-id="bg" data-width="1080" data-height="1920">
    <div id="bg-base"></div>
    <div id="bg-grid"></div>
    <div id="bg-dots"></div>
  </div>
  <script>
    (function () {
      function hash(i, s) {
        const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453;
        return x - Math.floor(x);
      }
      const dots = document.getElementById("bg-dots");
      for (let i = 0; i < 70; i++) {
        const d = document.createElement("div");
        d.className = "bg-dot";
        const r = 1 + hash(i, 3) * 2.4;
        d.style.left = (hash(i, 1) * 1080).toFixed(1) + "px";
        d.style.top = (hash(i, 2) * 1920).toFixed(1) + "px";
        d.style.width = d.style.height = r.toFixed(1) + "px";
        d.style.opacity = (0.2 + hash(i, 4) * 0.5).toFixed(2);
        dots.appendChild(d);
      }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg-grid", { x: 0, y: 0 }, { x: -60, y: -120, duration: 40, ease: "none" }, 0);
      tl.fromTo("#bg-dots", { y: 0 }, { y: -80, duration: 40, ease: "none" }, 0);
      window.__timelines["bg"] = tl;
    })();
  </script>
</template>
