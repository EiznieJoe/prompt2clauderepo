name: RMT sweep harian

# Dua kerja dalam satu cron:
#   1) Jalankan rmt_sweep() — gugurkan permohonan yang tamat tempoh
#      pembetulan, dan anonimkan rekod yang melepasi tempoh simpanan PDPA.
#   2) Projek Supabase free tier dijeda selepas 7 hari tiada aktiviti.
#      Panggilan harian ini memastikan ia tidak pernah tidur.
on:
  schedule:
    - cron: "17 1 * * *"   # 01:17 UTC = 09:17 MYT
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil rmt_sweep()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SERVICE_KEY}" ]; then
            echo "Secret SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY belum ditetapkan." >&2
            exit 1
          fi
          kod=$(curl -sS -o /tmp/keluaran.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/rmt_sweep" \
            -H "apikey: ${SERVICE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP ${kod}"
          cat /tmp/keluaran.json
          echo
          [ "${kod}" = "200" ]
