<!doctype html>
<html
  lang="ms"
  data-composition-variables='[{"id":"audioMix","type":"string","label":"Fail audio (mix)","default":"assets/audio/mix-dengan-vo.wav"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>DELIMa Champions 2026 — SK Rugading, Tuaran</title>
    <!-- GSAP disimpan dalam repo supaya render tak bergantung pada CDN -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #050b2e;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-fps="30"
      data-width="1920"
      data-height="1080"
    >
      <!-- Dunia digital berterusan di belakang semua scene -->
      <div id="world" class="clip" data-composition-id="world" data-composition-src="compositions/world.html"
        data-start="0" data-duration="60" data-track-index="0" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>

      <div id="s1-invite" class="clip" data-composition-id="s1-invite" data-composition-src="compositions/s1-invite.html"
        data-start="0" data-duration="5.1" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="s2-hero" class="clip" data-composition-id="s2-hero" data-composition-src="compositions/s2-hero.html"
        data-start="4.8" data-duration="7.5" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="s3-login" class="clip" data-composition-id="s3-login" data-composition-src="compositions/s3-login.html"
        data-start="11.2" data-duration="9" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="s4-battle" class="clip" data-composition-id="s4-battle" data-composition-src="compositions/s4-battle.html"
        data-start="19.6" data-duration="9.6" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="s5-quiz" class="clip" data-composition-id="s5-quiz" data-composition-src="compositions/s5-quiz.html"
        data-start="28.6" data-duration="8.6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="s6-poster" class="clip" data-composition-id="s6-poster" data-composition-src="compositions/s6-poster.html"
        data-start="36.6" data-duration="8.6" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="s7-draw" class="clip" data-composition-id="s7-draw" data-composition-src="compositions/s7-draw.html"
        data-start="44.6" data-duration="8.6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="s8-finale" class="clip" data-composition-id="s8-finale" data-composition-src="compositions/s8-finale.html"
        data-start="52.6" data-duration="7.4" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>

      <!-- Mix siap (muzik + SFX + narasi). Versi tanpa narasi: tukar pemboleh ubah audioMix
           kepada assets/audio/mix-tanpa-vo.wav. Bina semula mix: python3 tools/mix_audio.py -->
      <audio id="mix" class="clip" src="assets/audio/mix-dengan-vo.wav" data-var-src="audioMix"
        data-start="0" data-duration="60" data-track-index="9" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
