  <script>
    (function () {
      // Logo 3D: siluet bertopeng di belakang muka depan = ketebalan
      function buildLogo3D(el) {
        const name = el.dataset.logo;
        const depth = +el.dataset.depth;
        const mask = "url(assets/logos/" + name + ".png)";
        const front = el.querySelector(".front");
        function layer(cls, z, extra) {
          const d = document.createElement("div");
          d.className = cls;
          d.style.webkitMaskImage = mask;
          d.style.maskImage = mask;
          d.style.transform = "translateZ(" + z + "px)" + (extra || "");
          el.insertBefore(d, front);
          return d;
        }
        layer("rim", -depth - 6, " scale(1.04)");
        const n = 12;
        for (let i = n; i >= 1; i--) {
          const d = layer("side", (-depth * i) / n);
          d.style.filter = "brightness(" + (1 - (0.55 * i) / n).toFixed(2) + ")";
        }
        el.querySelector(".bevel").style.transform = "translateZ(0.6px)";
        const sheen = document.createElement("div");
        sheen.className = "sheen";
        sheen.style.webkitMaskImage = mask;
        sheen.style.maskImage = mask;
        sheen.style.transform = "translateZ(1.2px)";
        el.appendChild(sheen);
        return sheen;
      }
      const sheen = buildLogo3D(document.getElementById("s1-crest"));

      const tl = gsap.timeline({ paused: true });
      // 0.0-1.05 cahaya meluru ke tengah
      const len = document.getElementById("s1-race-core").getTotalLength();
      ["#s1-race-path", "#s1-race-core"].forEach(function (s) {
        tl.fromTo(s, { strokeDasharray: "260 " + len, strokeDashoffset: 260 },
          { strokeDashoffset: -len + 40, duration: 1.0, ease: "power2.in" }, 0.05);
        tl.to(s, { opacity: 0, duration: 0.15 }, 1.0);
      });
      // 1.05 portal terbuka
      tl.fromTo("#s1-core", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.1, ease: "expo.out" }, 1.0);
      tl.fromTo("#s1-ring1", { scale: 0.1, opacity: 0, rotate: -90 }, { scale: 1, opacity: 1, rotate: 0, duration: 1.2, ease: "expo.out" }, 1.03);
      tl.fromTo("#s1-ring2", { scale: 0.1, opacity: 0, rotate: 60 }, { scale: 1, opacity: 1, rotate: 0, duration: 1.3, ease: "expo.out" }, 1.1);

      // 1.3 lencana sekolah muncul dari dalam portal

        { z: 0, rotateY: 0, rotateX: 0, duration: 1.5, ease: "expo.out" }, 1.25);
      tl.fromTo("#s1-crest > *", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 1.25);
      // 2.7 sapuan cahaya emas

        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.6)" }, 2.15);
      // 4.3-5.1 zum menembusi portal ke scene 2
      tl.to(["#s1-line1 .s1-w", "#s1-ready"], { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 4.2);

      tl.to("#s1-crest > *", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.6);
      tl.to("#s1-portal", { scale: 5, duration: 0.65, ease: "power3.in" }, 4.3);
      tl.to("#s1-flash", { opacity: 1, duration: 0.35, ease: "power2.in" }, 4.6);
      tl.to("#s1-flash", { opacity: 0, duration: 0.14, ease: "none" }, 4.96);
      window.__timelines["s1-invite"] = tl;
    })();
