        d.className = "s7-cf";
        d.style.background = COLORS[i % COLORS.length];
        cf.appendChild(d);
        const fromL = i % 2 === 0;

          el: d,
          x0: fromL ? 700 : 1220,
          y0: 470,
          dx: (hash(i, 1) - 0.5) * 900 + (fromL ? -80 : 80),
          up: 260 + hash(i, 2) * 380,
          fall: 380 + hash(i, 3) * 300,
          rot: (hash(i, 4) - 0.5) * 1080,
          d: hash(i, 5) * 0.12,
        });
      }

      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#s7-title .s7-w", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.1, ease: "power3.out" }, 0.45);

      // kotak jatuh dan mendarat (45.8 s)
      tl.fromTo("#s7-boxL", { y: -620 }, { y: 0, duration: 0.32, ease: "power2.in" }, 0.88);
      tl.fromTo("#s7-boxR", { y: -620 }, { y: 0, duration: 0.32, ease: "power2.in" }, 0.96);
      tl.fromTo("#s7-boxL svg", { scaleY: 0.9, scaleX: 1.05, transformOrigin: "50% 100%" }, { scaleY: 1, scaleX: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.2);
      tl.fromTo("#s7-boxR svg", { scaleY: 0.9, scaleX: 1.05, transformOrigin: "50% 100%" }, { scaleY: 1, scaleX: 1, duration: 0.45, ease: "back.out(2.2)" }, 1.28);

      tl.fromTo("#s7-plus", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 2.0);
      tl.fromTo("#s7-chip2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 2.1);

      // jangkaan: cahaya bocor di celah penutup, kotak bergegar (seiring snare roll)
      tl.fromTo([".s7-seam"], { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 2.4, ease: "power2.in" }, 4.8);
      tl.fromTo(".s7-beam", { opacity: 0, scaleY: 0 }, { opacity: 0, scaleY: 0, duration: 0.01 }, 0);
      for (let k = 0; k < 12; k++) {
        const a = (k % 2 ? -1 : 1) * (1 + k * 0.22);
        tl.to("#s7-boxL svg", { rotate: a, duration: 0.11, ease: "sine.inOut" }, 5.88 + k * 0.11);
        tl.to("#s7-boxR svg", { rotate: -a, duration: 0.11, ease: "sine.inOut" }, 5.88 + k * 0.11);
      }
      tl.to([".s7-box svg"], { rotate: 0, duration: 0.06 }, 7.2);
      // 51.84 s penutup terbuka dengan cahaya emas + konfeti
      const OPEN = 7.24;

      tl.to("#s7-lidR", { y: -120, x: 170, rotate: 38, svgOrigin: "180 135", duration: 0.9, ease: "expo.out" }, OPEN);
      tl.to(".s7-beam", { opacity: 1, scaleY: 1, duration: 0.35, ease: "expo.out" }, OPEN);

      pieces.forEach(function (p) {

        tl.fromTo(p.el, { y: p.y0 }, { y: p.y0 - p.up, duration: 0.5, ease: "power2.out" }, OPEN + p.d);
        tl.to(p.el, { y: p.y0 - p.up + p.fall, duration: 0.8, ease: "power1.in" }, OPEN + p.d + 0.5);
      });
