  <script>
    (function () {
      function buildLogo3D(el) {
        const name = el.dataset.logo;
        const depth = +el.dataset.depth;
        const mask = "url(assets/logos/" + name + ".png)";
        const front = el.querySelector(".front");
        function layer(cls, z, extra) {
          const d = document.createElement("div");
          d.className = cls;
          d.style.webkitMaskImage = mask;
          d.style.maskImage = mask;
          d.style.transform = "translateZ(" + z + "px)" + (extra || "");
          el.insertBefore(d, front);
          return d;
        }
        layer("rim", -depth - 6, " scale(1.03)");
        const n = 14;
        for (let i = n; i >= 1; i--) {
          const d = layer("side", (-depth * i) / n);
          d.style.filter = "brightness(" + (1 - (0.55 * i) / n).toFixed(2) + ")";
        }
        el.querySelector(".bevel").style.transform = "translateZ(0.6px)";
        const sheen = document.createElement("div");
        sheen.className = "sheen";
        sheen.style.webkitMaskImage = mask;
        sheen.style.maskImage = mask;
        sheen.style.transform = "translateZ(1.2px)";
        el.appendChild(sheen);
        return sheen;
      }
      const sheenD = buildLogo3D(document.getElementById("s8-delima"));
      const sheenS = buildLogo3D(document.getElementById("s8-school"));

      const tl = gsap.timeline({ paused: true });
      // 53.2 s keluar dari limpahan cahaya scene 7
      // tersembunyi sehingga limpahan cahaya scene 7 memenuhi bingkai (52.87 s), kemudian pudar
      tl.fromTo("#s8-flood", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.27);
      tl.to("#s8-flood", { opacity: 0, duration: 0.7, ease: "power2.out" }, 0.6);
      tl.fromTo(["#s8-halo", "#s8-platform"], { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.6);
      // lambang DELIMa mendarat (utama), lencana sekolah di sisi
      tl.fromTo("#s8-delima", { z: -260, rotateY: 24, rotateX: 6 }, { z: 0, rotateY: 0, rotateX: 0, duration: 1.5, ease: "expo.out" }, 0.55);
      tl.fromTo("#s8-delima > *", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.55);
      tl.fromTo("#s8-school", { z: -220, rotateY: -22 }, { z: 0, rotateY: 0, duration: 1.3, ease: "expo.out" }, 1.05);
      tl.fromTo("#s8-school > *", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.05);
      tl.fromTo(sheenS, { backgroundPosition: "160% 0" }, { backgroundPosition: "-60% 0", duration: 0.8, ease: "power2.inOut" }, 1.6);
      tl.fromTo("#s8-name-t", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 1.45);
      tl.fromTo("#s8-years-t", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 2.0);
      // LOGIN • PLAY • WIN! ikut sebutan narasi
      tl.fromTo("#s8-pill", { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: "expo.out" }, 2.5);
      [["#s8-k1", 2.82], ["#s8-d1", 3.3], ["#s8-k2", 3.64], ["#s8-d2", 4.1], ["#s8-k3", 4.32]].forEach(function (k) {
        tl.fromTo(k[0], { opacity: 0, scale: 0.6, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "back.out(1.7)" }, k[1]);
      });
      tl.fromTo("#s8-wait-t", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power3.out" }, 4.4);

      tl.set({}, {}, 7.4);
      window.__timelines["s8-finale"] = tl;
