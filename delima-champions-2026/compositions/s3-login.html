    (function () {
      function buildLogo3D(el) {
        const name = el.dataset.logo;
        const depth = +el.dataset.depth;
        const mask = "url(assets/logos/" + name + ".png)";
        const front = el.querySelector(".front");
        function layer(cls, z, extra) {
          const d = document.createElement("div");
          d.className = cls;
          d.style.webkitMaskImage = mask;
          d.style.maskImage = mask;
          d.style.transform = "translateZ(" + z + "px)" + (extra || "");
          el.insertBefore(d, front);
          return d;
        }
        layer("rim", -depth - 3, " scale(1.03)");
        const n = 8;
        for (let i = n; i >= 1; i--) {
          const d = layer("side", (-depth * i) / n);
          d.style.filter = "brightness(" + (1 - (0.55 * i) / n).toFixed(2) + ")";
        }
        el.querySelector(".bevel").style.transform = "translateZ(0.6px)";
      }
