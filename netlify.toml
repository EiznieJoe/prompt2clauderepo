# Netlify menerbitkan HANYA folder rmt/. Projek HyperFrames di root repo ini
# tidak disentuh dan tidak dideploy.
[build]
  publish = "rmt"
  command = "sh scripts/build-config.sh"

# Header keselamatan. CSP ketat: tiada inline script/style, tiada CDN pihak
# ketiga, satu-satunya destinasi luar ialah Supabase.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Papan pemuka pegawai tidak perlu diindeks enjin carian.
[[headers]]
  for = "/staf.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
